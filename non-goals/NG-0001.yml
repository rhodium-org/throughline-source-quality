uid: NG-0001
type: non_goal
status: ratified
title: This graph is not composed by the sources it governs
text: 'A governed source does not declare this graph as a `[[sources]]` dependency
  and does not name its UIDs in item links. Composition is transitive, so a source
  that composed this graph would carry it into every consumer''s union: fetched into
  each consumer''s cache, its items checked and rendered beside the standard the
  consumer asked for, and its label taking a name in the consumer''s union, which
  a consumer already using that name must alias apart. Sources exist to be composed
  by other people, and loading them with the toolchain''s own housekeeping is a cost
  every consumer pays forever. These requirements are applied through construction
  instead — the generator that builds a source satisfies them, and the commit that
  changes that generator cites them.'
rationale: Composing this graph from each governed source was rejected. Composition
  is transitive, so the reference would resolve, but this graph would then ride into
  every union the source enters, at a cost paid by consumers who never asked for
  it.
normative: false
