uid: REQ-0007
type: requirement
status: ratified
title: The publisher's own clause identifier lives in an attribute, not in the UID
text: The published identifier of a clause — "V2.1.1", "1.4.3" — is recorded as an
  attribute of the item. It is not encoded in the UID, because the two are governed
  by different parties — the publisher renumbers its clauses between editions, while
  a UID must stay fixed for the consumers citing it.
normative: true
