uid: REQ-0004
type: requirement
status: ratified
title: A UID, once allocated to a clause, is permanent
text: Consumers cite borrowed items by UID, and those citations live in repositories
  this source cannot see. Re-running a generator against a newer edition of the standard
  therefore allocates UIDs only to clauses that do not yet have one, and never renumbers,
  reuses or reorders a UID already published.
normative: true
